search_food:
  name: Chercher un aliment (Yazio)
  description: >-
    Cherche un aliment dans la base Yazio et calcule la quantité à logger.
    Ne journalise rien. À utiliser avant log_food, puis attendre la
    confirmation explicite de l'utilisateur.
  fields:
    food:
      required: true
      example: "pomme"
      selector:
        text:
    quantity:
      required: true
      example: 150
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    unit:
      required: true
      example: "g"
      selector:
        text:

log_food:
  name: Logger un aliment (Yazio)
  description: >-
    Enregistre un aliment dans le journal Yazio. À n'appeler qu'après
    confirmation explicite de l'utilisateur, avec les valeurs renvoyées par
    search_food.
  fields:
    product_id:
      required: true
      selector:
        text:
    amount:
      required: true
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    serving:
      required: false
      selector:
        text:
    serving_quantity:
      required: false
      selector:
        number:
          mode: box
    meal:
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack
