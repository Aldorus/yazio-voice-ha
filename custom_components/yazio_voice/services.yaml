search_food:
  name: Search for a food (Yazio)
  description: >-
    Searches the Yazio database for a food and computes the amount to log.
    Logs nothing. Use before log_food, then wait for the user's explicit
    confirmation.
  fields:
    food:
      required: true
      example: "apple"
      selector:
        text:
    quantity:
      required: true
      example: 150
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    unit:
      required: true
      example: "g"
      selector:
        text:

log_food:
  name: Log a food (Yazio)
  description: >-
    Records a food in the Yazio diary. Only call after the user's explicit
    confirmation, using the values returned by search_food.
  fields:
    product_id:
      required: true
      selector:
        text:
    amount:
      required: true
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    serving:
      required: false
      selector:
        text:
    serving_quantity:
      required: false
      selector:
        number:
          mode: box
    meal:
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack
