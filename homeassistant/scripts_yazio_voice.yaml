# To be merged into scripts.yaml. These are the ONLY TWO entities to expose
# to Assist (Settings > Voice assistants > Expose) so that the conversation
# agent (Claude) can use them as tools during a voice conversation.
#
# Expected flow on the agent side:
#   1. Call yazio_search_food with what the user dictated.
#   2. Relay the result to the user ("I found Apple, 150g, shall I log
#      it?") and wait for their confirmation in the same voice exchange.
#   3. If confirmed, call yazio_log_food with the product_id/amount/serving
#      returned by step 1 and the meal dictated by the user.
# Never call yazio_log_food without explicit confirmation.

yazio_search_food:
  alias: "Yazio - Search for a food"
  description: >
    Searches the Yazio database for a food and computes the amount to log.
    Logs nothing. Use BEFORE yazio_log_food, then wait for the user's
    confirmation.
  fields:
    food:
      name: Food
      description: "Name of the food as dictated, e.g. apple, chicken"
      required: true
      selector:
        text: {}
    quantity:
      name: Quantity
      description: "Dictated quantity, e.g. 150"
      required: true
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    unit:
      name: Unit
      description: "Dictated unit, e.g. g, ml, piece, portion"
      required: true
      selector:
        text: {}
  sequence:
    - action: yazio_voice.search_food
      data:
        food: "{{ food }}"
        quantity: "{{ quantity }}"
        unit: "{{ unit }}"
      response_variable: result
    - stop: ""
      response_variable: result
  mode: parallel
  max: 10

yazio_log_food:
  alias: "Yazio - Log a food"
  description: >
    Records a food in the Yazio diary. Only call it after the user's
    explicit confirmation and after calling yazio_search_food to obtain
    product_id/amount/serving.
  fields:
    product_id:
      name: Product ID
      description: "product_id returned by yazio_search_food"
      required: true
      selector:
        text: {}
    amount:
      name: Amount (base unit)
      description: "amount returned by yazio_search_food"
      required: true
      selector:
        number:
          mode: box
          min: 0
          step: 0.1
    serving:
      name: Serving
      description: "serving returned by yazio_search_food (optional)"
      required: false
      selector:
        text: {}
    serving_quantity:
      name: Serving quantity
      description: "serving_quantity returned by yazio_search_food (optional)"
      required: false
      selector:
        number:
          mode: box
    meal:
      name: Meal
      description: "Meal dictated by the user"
      required: true
      selector:
        select:
          options:
            - breakfast
            - lunch
            - dinner
            - snack
  sequence:
    - action: yazio_voice.log_food
      data:
        product_id: "{{ product_id }}"
        amount: "{{ amount }}"
        serving: "{{ serving | default(none) }}"
        serving_quantity: "{{ serving_quantity | default(none) }}"
        meal: "{{ meal }}"
      response_variable: result
    - stop: ""
      response_variable: result
  mode: parallel
  max: 10
